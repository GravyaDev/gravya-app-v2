name: Catena di fornitura

# Controllo OSV del lockfile (DECISIONS §4 «Catena di fornitura e
# aggiornamenti»; §6 «Minuti di GitHub Actions»). Su GitHub gira solo quando
# cambia cio' che puo' cambiarne l'esito (lockfile, script, questo workflow) o a
# mano. Il controllo settimanale (nuove vulnerabilita' senza push), il confronto
# del digest di PostgreSQL e la rigenerazione del lockfile girano in locale:
# `scripts/fornitura-locale.py`, con un timer systemd utente (vedi README).
# Niente `schedule` e niente `pull_request`, per non consumare minuti.

on:
  push:
    # Solo branch: un push di tag non avvia nulla (e non consuma minuti).
    branches:
      - "**"
    paths:
      - "requirements.lock.txt"
      - "scripts/osv-check.py"
      - ".github/workflows/fornitura.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  osv:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Action fissate per SHA del commit (non per tag mobile), CA R-09.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Vulnerabilita' note nel lockfile (OSV)
        run: python3 scripts/osv-check.py requirements.lock.txt
