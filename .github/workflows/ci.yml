name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Servizi definiti UNA volta (ancora YAML `&servizi`, riusata dal job sotto):
    # il digest di PostgreSQL sta in un solo punto. `scripts/agenti.py` legge
    # questa riga `image:` (deve restare una sola immagine distinta).
    services: &servizi
      postgres:
        image: postgres:18@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
        env:
          POSTGRES_USER: ci_writer
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      API_ENV: development
      DATABASE_URL: postgresql+psycopg://ci_writer@localhost:5432/gravya_e1_test
      GRAVYA_E1_TEST_DSN: host=localhost user=ci_writer dbname=gravya_e1_test
      PGHOST: localhost
      PGUSER: ci_writer
    steps:
      # Action fissate per SHA del commit (non per tag mobile), CA R-09.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Installa le dipendenze (lockfile con hash)
        run: |
          pip install --require-hashes -r requirements.lock.txt
          # Giro 4 (CA G3-09): nessun isolamento di build (altrimenti pip
          # scaricherebbe setuptools/wheel non fissati in un venv usa e
          # getta): sono nel lockfile sopra, con hash.
          pip install --no-build-isolation --no-deps -e .
      - name: Crea il database di test
        # Giro 4 (CA G3-09): `psycopg` e' gia' nel lockfile (con hash);
        # evita un `apt-get install postgresql-client` non fissato per
        # un solo CREATE DATABASE (il job "test-non-superuser" sotto usa
        # ancora `psql` per l'intera orchestrazione SQL dello script: non
        # evitabile senza riscriverlo, dichiarato residuo nel report).
        run: |
          python -c "
          import psycopg
          conn = psycopg.connect('postgresql://ci_writer@localhost:5432/postgres', autocommit=True)
          conn.execute('CREATE DATABASE gravya_e1_test')
          "
      - name: Applica le migrazioni
        run: alembic upgrade head
      - name: Esegue i test
        run: pytest -q --basetemp="${{ runner.temp }}/pytest"

  test-non-superuser:
    # Criterio di fine 2 (E1 v1.6): le migrazioni e l'applicazione devono
    # funzionare con un proprietario di schema non superuser. Job separato
    # (non sostituisce "test" sopra, che resta con admin_conn/superuser per
    # ispezionare i dati bypassando RLS): bootstrap una tantum, da superuser,
    # dei ruoli che richiedono privilegi che un proprietario di migrazione
    # non superuser non puo' concedersi da solo, poi migrazioni e verifica
    # funzionale con `gravya_migrator`/un ruolo non superuser (vedi
    # scripts/test-non-superuser.sh).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services: *servizi
    env:
      API_ENV: development
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: ci_writer
      SCRATCH_DB: gravya_e1_ci_nonsuper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Installa le dipendenze (lockfile con hash)
        run: |
          pip install --require-hashes -r requirements.lock.txt
          pip install --no-build-isolation --no-deps -e .
      - name: Bootstrap, migrazioni e verifica con ruolo non superuser
        # `psql` dalla stessa immagine (stesso digest) del servizio PostgreSQL,
        # non da apt: niente pacchetto non fissato. `--network host` per
        # raggiungere la porta 5432 pubblicata dal servizio.
        run: |
          IMMAGINE="$(docker inspect --format '{{.Config.Image}}' '${{ job.services.postgres.id }}')"
          case "$IMMAGINE" in postgres:*@sha256:*) ;; *) echo "ERRORE: immagine del servizio inattesa: $IMMAGINE" >&2; exit 1;; esac
          export GRAVYA_PSQL="docker run --rm -i --network host $IMMAGINE psql"
          bash scripts/test-non-superuser.sh
